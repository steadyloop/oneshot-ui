<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Build and tailor resumes with OneShot.">
  <title>Resumes · OneShot</title>
  <link rel="stylesheet" href="/static/resume/desktop.css">
  <link rel="stylesheet" href="/static/shared/shell.css">
  <link rel="stylesheet" href="/static/resume/workspace.css">
  <script src="/static/shared/boot.js"></script>
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to resumes</a>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-opportunities" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="icon-applications" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
    <symbol id="icon-feed-status" viewBox="0 0 24 24"><path d="M3 17V9M9 17V4M15 17v-6M21 17V7"/></symbol>
    <symbol id="icon-resume" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17Z"/><path d="m13.5 6.5 3 3"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 13 4 4L19 7"/></symbol>
    <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
    <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="icon-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="icon-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="icon-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6"/></symbol>
  </svg>

  <header class="app-topbar">
    <a class="brand-cell" href="/" aria-label="OneShot Applications home">
      <span class="wordmark"><span class="wordmark-name">OneShot</span><span class="wordmark-descriptor">Applications</span></span>
    </a>
    <div class="topbar-space"></div>
  </header>
  <div class="shell app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <nav class="side-nav" aria-label="Primary">
        <a href="/"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Discover</span><b data-opportunity-count hidden aria-hidden="true">—</b></a>
        <a href="/application/"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="m9 14 2 2 4-4"/></svg><span>Applied</span></a>
        <a class="active" href="/resume/" aria-current="page"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/></svg><span>Resume</span></a>
        <a href="/source-coverage/" title="Feed Status"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1" fill="currentColor"/></svg><span>Feeds</span></a>
      </nav>
      <div class="account-slot" data-account-slot aria-label="Account"></div>
    </aside>

    <main id="workspace" class="workspace" tabindex="-1">
      <div class="page-tabs-row">
        <nav class="page-tabs" role="tablist" aria-label="Resume pages">
          <button id="profile-tab" class="page-tab" role="tab" aria-selected="true" aria-controls="view" data-tab="profile">Profile</button>
          <button id="resumes-tab" class="page-tab" role="tab" aria-selected="false" aria-controls="view" tabindex="-1" data-tab="resumes">My resumes <span data-resume-count>0</span></button>
        </nav>
        <div class="page-actions">
          <div id="tab-action"></div>
        </div>
      </div>
      <div class="workspace-content">
        <section id="view" class="resume-view" role="tabpanel" aria-labelledby="profile-tab" aria-live="polite">
          <div class="loading-state"><span></span><p>Loading resumes…</p></div>
        </section>
      </div>
    </main>
  </div>

  <dialog id="resume-dialog" class="modal" aria-labelledby="resume-dialog-title">
    <form id="resume-form" method="dialog">
      <header class="dialog-header"><h2 id="resume-dialog-title">New resume</h2><button class="icon-button" type="button" data-close-dialog aria-label="Close"><svg aria-hidden="true"><use href="#icon-close"/></svg></button></header>
      <div class="dialog-fields">
        <label>Resume name<input name="name" required maxlength="300" placeholder="e.g. Software engineering"></label>
        <label>Target role<select name="target_job_id" data-target-select></select></label>
        <label>Starting content<select name="variant" data-variant-select></select></label>
      </div>
      <footer class="dialog-actions"><button class="button danger-text" type="button" data-close-dialog>Cancel</button><button class="button primary" type="submit">Create resume</button></footer>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
