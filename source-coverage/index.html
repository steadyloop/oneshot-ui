<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="The OneShot feed status workspace.">
  <title>Feed Status · OneShot</title>
  <link rel="stylesheet" href="/static/source-coverage/styles.css?v=board-wall-20260929b">
  <link rel="stylesheet" href="/static/navigation.css?v=lockup-20260901">
  <script defer src="/static/api-client.js?v=guest-empty-20260903"></script>
  <script defer src="/static/nav-count.js?v=visitor-local-20260816"></script>
  <script defer src="/static/source-coverage/app.js?v=board-wall-20260929b"></script>
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to feed status</a>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-opportunities" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="icon-applications" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
    <symbol id="icon-feed-status" viewBox="0 0 24 24"><path d="M3 17V9M9 17V4M15 17v-6M21 17V7"/></symbol>
    <symbol id="icon-sources" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="m8 11 8-4M8 13l8 4"/></symbol>
    <symbol id="icon-postings" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
    <symbol id="icon-spark" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="icon-alert" viewBox="0 0 24 24"><path d="M12 4 3.5 19h17L12 4Z"/><path d="M12 9v4M12 16h.01"/></symbol>
    <symbol id="icon-resume" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/></symbol>
  </svg>

  <div class="shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <a class="brand" href="/"><img class="brand-mark" src="/static/brand-mark.svg?v=20260813" alt="" width="32" height="32"><span class="brand-word">OneShot</span><span class="brand-sub">Application</span></a>
      <nav class="side-nav">
        <p>Discover</p>
        <a href="/"><svg class="nav-icon" aria-hidden="true"><use href="#icon-opportunities"/></svg>Opportunities <b data-opportunity-count>—</b></a>
        <p>Track</p>
        <a href="/application/"><svg class="nav-icon" aria-hidden="true"><use href="#icon-applications"/></svg>Applications</a>
        <a href="/resume/"><svg class="nav-icon" aria-hidden="true"><use href="#icon-resume"/></svg>Resume</a>
        <p>System</p>
        <a class="active" href="/source-coverage/" aria-current="page"><svg class="nav-icon" aria-hidden="true"><use href="#icon-feed-status"/></svg>Feed Status</a>
      </nav>
    </aside>

    <main id="workspace" class="workspace" tabindex="-1">
      <header class="page-header">
        <h1>Feed Status</h1>
        <span id="clock" class="clock" aria-label="Current time">—</span>
      </header>

      <section class="source-section" aria-labelledby="fleet-stats">
        <header class="section-header">
          <div class="section-title">
            <h2 id="fleet-stats">Loading fleet…</h2>
            <span id="stale-note" class="stale-note" hidden aria-live="polite"><i aria-hidden="true"></i>Refresh failed — showing last known data</span>
          </div>
          <div class="legend-row" aria-label="Cell states">
            <span class="legend-key ok" title="Healthy. Darker = more jobs on the board (0 → 10k+)."><i aria-hidden="true"></i>ok <b data-state-count="ok">—</b></span>
            <span class="legend-key failing" title="3+ polls in a row failed."><i aria-hidden="true"></i>failing <b data-state-count="failing">—</b></span>
            <span class="legend-key degraded" title="The last 1–2 polls failed; it will try again."><i aria-hidden="true"></i>retrying <b data-state-count="degraded">—</b></span>
            <span class="legend-key stale" title="Missed its scheduled check (over 3× its normal interval)."><i aria-hidden="true"></i>overdue <b data-state-count="stale">—</b></span>
            <span class="legend-key paused"><i aria-hidden="true"></i>paused <b data-state-count="paused">—</b></span>
            <span class="legend-key never"><i aria-hidden="true"></i>never polled <b data-state-count="never">—</b></span>
          </div>
        </header>
        <div id="coverage-content">
          <div class="state loading-state"><span class="spinner"></span><p>Loading feed status…</p></div>
        </div>
      </section>
    </main>
  </div>
  <div class="board-tip" id="board-tip" role="tooltip"></div>
</body>
</html>
