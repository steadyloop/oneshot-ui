  <div class="shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <a class="brand" href="/"><img class="brand-mark" src="/static/brand-mark.svg?v=20260813" alt="" width="32" height="32"><span class="brand-word">OneShot</span><span class="brand-sub">Application</span></a>
      <nav class="side-nav">

      </nav>
    </aside>

    <main id="workspace" class="workspace" tabindex="-1">
      <header class="page-header">
        <h1>Feed Status</h1>
        <span id="clock" class="clock" aria-label="Current time">—</span>
      </header>

      <p id="fleet-stats" class="fleet-stats">Loading fleet…</p>

      <section class="source-section" aria-labelledby="source-list-title">
        <header class="section-header">
          <div class="section-title">
            <h2 id="source-list-title">Boards</h2>
            <span id="stale-note" class="stale-note" hidden aria-live="polite"><i aria-hidden="true"></i>Refresh failed — showing last known data</span>
          </div>
          <div class="legend-row" aria-label="Cell states">
            <span class="legend-key ok"><i aria-hidden="true"></i>ok</span>
            <span class="legend-key degraded"><i aria-hidden="true"></i>degraded</span>
            <span class="legend-key failing"><i aria-hidden="true"></i>failing</span>
            <span class="legend-key stale"><i aria-hidden="true"></i>stale</span>
            <span class="legend-key paused"><i aria-hidden="true"></i>paused</span>
            <span class="legend-key never"><i aria-hidden="true"></i>never polled</span>
          </div>
        </header>
        <div id="coverage-content">
          <div class="state loading-state"><span class="spinner"></span><p>Loading feed status…</p></div>
        </div>
      </section>
    </main>
  </div>
