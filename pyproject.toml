[project]
name = "oneshot-ui"
version = "0.1.0"
description = "OneShot web app: the browser client and its request-facing API."
requires-python = ">=3.12"
# Request-facing API only; the crawler stays in its own private repository.
dependencies = [
    "asyncpg>=0.29",
    "fastapi>=0.141.1",
    "httpx>=0.27",
    "itsdangerous>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typst>=0.15",
    "uvicorn>=0.52.0",
]

[project.scripts]
oneshot-ui = "api.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["api", "api.jobs", "api.tracker", "api.resume", "api.taxonomy"]

[tool.setuptools.package-data]
"api.resume" = ["fonts/barlow/*.ttf", "fonts/barlow/*.txt"]
"api.taxonomy" = ["registry/job-posting/*.yaml"]
